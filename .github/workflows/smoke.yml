name: smoke

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ vars.ARC_UP == 'true' && 'arc-arm64' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "runner: ${RUNNER_NAME} (ARC_UP=${{ vars.ARC_UP }})"
          uname -m

  # Manual runs only: four jobs at once against a pod quota of 2, to watch the cap.
  quota:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.ARC_UP == 'true' && 'arc-arm64' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - run: |
          echo "job ${{ matrix.n }} on ${RUNNER_NAME}"
          sleep 90
  # ARC only: host.k3d.internal exists only inside cicd.
  pull:
    if: vars.ARC_UP == 'true'
    runs-on: arc-arm64
    steps:
      - run: |
          docker info --format 'mirrors: {{json .RegistryConfig.Mirrors}}'
          docker pull alpine:3.22
          docker pull host.k3d.internal:5002/dagger/engine:v0.21.11
  # Manual runs only: the testbed's scale set is also labelled ubuntu-24.04-arm.
  # Does GitHub split these between it and the hosted arm pool?
  race:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - run: |
          echo "race ${{ matrix.n }}: ${RUNNER_ENVIRONMENT} ${RUNNER_NAME}"
          sleep 30
  # Only a self-hosted runner can take this, so it proves the label reached GitHub.
  label-control:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ubuntu-24.04-arm]
    steps:
      - run: echo "control: ${RUNNER_ENVIRONMENT} ${RUNNER_NAME}"
